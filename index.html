<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowStock — Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Apply saved theme before first paint to avoid a white flash on refresh
        (function () {
            try {
                if (localStorage.getItem("flowstock_theme") === "night") {
                    document.documentElement.classList.add("night");
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="shell" id="shell">

        <!-- Sidebar: folders and lists -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark">F</span>
                <span class="brand-name">FlowStock</span>
            </div>
            <nav class="side-nav" id="sideNav" aria-label="Folders and lists"></nav>
        </aside>
        <div class="scrim" id="scrim"></div>

        <div class="main">
            <!-- Top bar -->
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menuBtn" title="Show folders" aria-label="Show folders">
                    <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
                </button>
                <div class="crumbs" id="crumbs"></div>
                <input type="search" id="searchInput" placeholder="Search…" class="search">
                <button class="add-btn" id="addBtn">+ Add item</button>
                <button class="theme-btn" id="themeBtn" title="Toggle night mode">🌙</button>
            </header>

            <div class="content">
                <div class="list-head">
                    <h1 id="panelTitle" class="list-title">Inventory</h1>
                </div>

                <!-- Stat cards -->
                <section class="stats" id="stats"></section>

                <!-- Shown when there is no list to display yet -->
                <div class="empty-state" id="emptyState" hidden>
                    <div class="empty-title">Nothing open yet</div>
                    <p>Click the folder icon next to <strong>Inventory</strong> or <strong>Tasks</strong> in the sidebar to create a folder,<br>then use the <strong>+</strong> on the folder to add a list.</p>
                </div>

                <!-- Main panel -->
                <main class="panel" id="panel">
                    <!-- Inventory view -->
                    <div id="inventoryView" class="view active">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>SKU</th>
                                    <th>Stock</th>
                                    <th>Price</th>
                                    <th>Reorder at</th>
                                    <th>Status</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="inventoryBody"></tbody>
                        </table>
                    </div>

                    <!-- Tasks view -->
                    <div id="tasksView" class="view">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Task</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Due</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tasksBody"></tbody>
                        </table>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="tree.js"></script>
    <script src="tasks.js"></script>
    <script src="inventory.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
